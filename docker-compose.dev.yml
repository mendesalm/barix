version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: barix_db_dev
    environment:
      POSTGRES_USER: barix_user
      POSTGRES_PASSWORD: barix_password
      POSTGRES_DB: barix_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
